# Hosts the Kolis admin / enterprise (shipper + carrier) / developer web app.
# It's a Next.js 14 app living in admin-web/, so the build runs from there and
# the Next.js runtime plugin handles SSR + routing.
[build]
  base = "admin-web"
  command = "npm run build"
  # publish is resolved RELATIVE TO base, so this must NOT repeat "admin-web"
  # (Netlify CI would look for admin-web/admin-web/.next and fail the deploy).
  # ⚠ This holds for netlify-cli 27.4.1, which BOTH deploy scripts pin. Newer CLIs
  # resolve it from the repo root instead: with "admin-web/.next" they then deploy a
  # build whose server handler 502s on `ENOENT /run-config.json`, because the plugin
  # writes that file relative to base. Pin the CLI rather than editing this path.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical domain: force the raw Netlify subdomain to business.kolis.ca (301).
[[redirects]]
  from = "https://kolis-business.netlify.app/*"
  to = "https://business.kolis.ca/:splat"
  status = 301
  force = true
