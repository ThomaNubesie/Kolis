# Hosts the Kolis admin / enterprise (shipper + carrier) / developer web app.
# It's a Next.js 14 app living in admin-web/, so the build runs from there and
# the Next.js runtime plugin handles SSR + routing.
[build]
  base = "admin-web"
  command = "npm run build"
  # ".next" is correct — leave it. It resolves properly PROVIDED the CLI is run from
  # admin-web/ (see deploy-prod.sh). Run from the repo root instead and the CLI resolves
  # publish to Kolis/.next and onBuild fails; "fixing" that by writing "admin-web/.next"
  # then makes the CLI detect the root EXPO app and ship a 436 KB stub handler that 502s
  # on every route while reporting success. This line has been flipped twice before
  # (f3bbc75, 24345bc) — the fix is the working directory, never the path.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Canonical domain: force the raw Netlify subdomain to business.kolis.ca (301).
[[redirects]]
  from = "https://kolis-business.netlify.app/*"
  to = "https://business.kolis.ca/:splat"
  status = 301
  force = true
